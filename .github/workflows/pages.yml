name: Test and publish game
# One Pages site, two builds:
#   /           production, from main
#   /preprod/   preprod, from the preprod branch, to try changes before they reach main
#   /pixi/      redirects to /preprod/ (the old preprod address)
# Each run publishes the whole site, but a push gates only its own branch (v0.2 council round 2,
# Opus F3): the pushed commit is tested, swept and built, and must pass. The other branch keeps its
# last good build, the one the site serves now (kept as an artifact by the run that published it).
# When the other branch's tip is newer than what is live, this run tests and builds that tip too and
# publishes it if it passes; if it fails, the last good build stays (that leg shows red, the push
# still deploys). Every published build comes from one exact, tested commit, never a fresh clone, and
# /deployed.json names both SHAs.
# A rerun keeps its original event SHA (Sol P1, round 2): right before publishing, each SHA must
# still be its branch's tip or what the site serves now. Freshness is judged per branch (Sol P1,
# round 3): when the other branch's new tip is superseded while this run assembles, the run publishes
# its pushed build with the other branch's live build (a second, fallback bundle); only a superseded
# pushed commit, or a stale branch with no live build to fall back on, publishes nothing.
# Every build artifact and Pages bundle is named by run and attempt, and the site is assembled only
# from the builds this attempt uploaded (Sol P2, round 3): a rerun never picks up an earlier attempt's
# artifact, and deploy-pages never sees two bundles with one name.
# Round 4: the build legs declare no job outputs (Neon P1: matrix legs share one job-level outputs map,
# so the leg that finished last could blank the other branch's artifact name); the assemble job lists
# this run's artifacts and takes each build by its exact name, attempt included. Runs queue in order
# (Sol P3: by default a group keeps one pending run, so a third push replaced the queued one), and a
# live build whose kept artifact expired is rebuilt through the same tests (Sol P4).
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
  # every push waits its turn (up to 100 pending runs) instead of replacing the one already waiting
  queue: max
jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pin.outputs.targets }}
      build: ${{ steps.pin.outputs.build }}
      pushed: ${{ steps.pin.outputs.pushed }}
      keep: ${{ steps.pin.outputs.keep }}
      keep_name: ${{ steps.pin.outputs.keep_name }}
      keep_run: ${{ steps.pin.outputs.keep_run }}
    steps:
      - id: pin
        name: Pin the pushed commit, and the other branch to its tip or its last good build
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pushed = context.ref.replace(/^refs\/heads\//, '');
            if (pushed !== 'main' && pushed !== 'preprod') return core.setFailed(`Run this workflow from main or preprod, not ${context.ref}`);
            const tip = async (branch) => {
              try { return (await github.rest.repos.getBranch({ owner, repo, branch })).data.commit.sha; }
              catch (e) { if (e.status === 404) return ''; throw e; }
            };
            // what the site serves now ([] before the first deploy); the query string skips the CDN cache
            const live = await (async () => {
              try {
                const site = (await github.rest.repos.getPages({ owner, repo })).data.html_url.replace(/\/$/, '');
                const res = await fetch(`${site}/deployed.json?run=${context.runId}-${Date.now()}`, { cache: 'no-store' });
                const list = res.ok ? await res.json() : [];
                return Array.isArray(list) ? list : [];
              } catch { return []; }
            })();
            // the tested build the site serves for this branch, if its artifact is still there: /deployed.json
            // names its artifact and run; a site published before round 3 names only the SHA (`dist-<branch>-<sha>`)
            const keptBuild = async (branch, entry) => {
              const named = typeof entry.artifact === 'string' && entry.artifact.startsWith(`dist-${branch}-${entry.sha}`);
              const name = named ? entry.artifact : `dist-${branch}-${entry.sha}`;
              const { data } = await github.rest.actions.listArtifactsForRepo({ owner, repo, name, per_page: 20 });
              const hit = data.artifacts.find(a => !a.expired && (!named || a.workflow_run?.id === entry.run));
              return hit?.workflow_run?.id ? { branch, sha: entry.sha, run: hit.workflow_run.id, name } : null;
            };
            const build = [];
            const targets = [];
            let keep = null;
            for (const branch of ['main', 'preprod']) {
              const sha = branch === pushed ? context.sha : await tip(branch);
              if (!sha) {
                if (branch === 'main') return core.setFailed('main has no commit to publish');
                continue;
              }
              targets.push({ branch, sha });
              // the pushed commit must pass: it is the only build this push gates
              if (branch === pushed) { build.push({ branch, sha, gate: true }); continue; }
              const entry = live.find(t => t.branch === branch && typeof t.sha === 'string');
              const kept = entry ? await keptBuild(branch, entry) : null;
              if (kept) keep = kept;
              // the site serves a build whose artifact has expired: rebuild that exact commit through the same
              // tests, so a failing newer tip still has a tested live build to fall back on (Sol P4, round 4)
              const rebuild = entry && !kept && entry.sha !== sha;
              // a newer tip is built too; it gates only when there is no last good build to fall back on
              if (sha !== kept?.sha) build.push({ branch, sha, gate: !kept && !rebuild });
              if (rebuild) build.push({ branch, sha: entry.sha, gate: false, live: true });
            }
            core.setOutput('pushed', pushed);
            core.setOutput('targets', JSON.stringify(targets));
            core.setOutput('build', JSON.stringify(build));
            core.setOutput('keep', keep ? JSON.stringify(keep) : '');
            core.setOutput('keep_name', keep?.name ?? '');
            core.setOutput('keep_run', keep ? String(keep.run) : '');
            await core.summary.addRaw(`Pushed ${pushed} ${context.sha}. Building ${build.map(b => `${b.branch} ${b.sha}${b.live ? ' (the live build, its artifact expired)' : b.gate ? '' : ' (falls back to the live build)'}`).join(', ')}.${keep ? ` Last good ${keep.branch}: ${keep.sha} (run ${keep.run}).` : ''}\n`).write();
  # Build and deploy are separate jobs (the layout GitHub documents): deploying in the same job as
  # the upload sometimes asked for the artifact before it was listed ("No artifacts named
  # github-pages"), failing about one push in three.
  build:
    needs: pin
    name: Test and build ${{ matrix.branch }} ${{ matrix.sha }}
    runs-on: ubuntu-latest
    # no job outputs: matrix legs share one outputs map, the last leg to finish wins (Neon P1, round 4).
    # A leg's upload is its last step, so this attempt's artifact exists only if the leg passed.
    strategy:
      # one branch's failing tip must not stop the other branch's build (Opus F3)
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pin.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - name: Check the checkout is the pinned commit
        env:
          PINNED: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$PINNED"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the pinned commit must pass its own tests before its build is published
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # npm test runs the 6-seed difficulty sanity check; this is the strict one: every level at 20 seeds
      # on the exact bands (scripts/difficulty-release.mjs). A commit from before the sweep existed (main
      # until the v0.2 merge) has no script to run and gets a warning instead.
      - name: Difficulty release sweep (20 seeds, exact bands)
        env:
          BRANCH: ${{ matrix.branch }}
          PINNED: ${{ matrix.sha }}
        run: |
          if [ ! -f scripts/difficulty-release.mjs ]; then
            echo "::warning::$BRANCH $PINNED predates the difficulty release sweep; not swept"
            exit 0
          fi
          status=0
          DIFFICULTY_OUT="$RUNNER_TEMP/difficulty" npm run difficulty:release || status=$?
          if [ -f "$RUNNER_TEMP/difficulty/summary.md" ]; then cat "$RUNNER_TEMP/difficulty/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - run: npm run build
      # named by commit, run and attempt and kept, so a later run for the other branch can republish this
      # exact build, and a rerun never mistakes an earlier attempt's upload for its own
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.branch }}-${{ matrix.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 90
  assemble:
    needs: [pin, build]
    # runs when a build leg failed too: only the pushed branch has to pass (see the choose step)
    if: ${{ !cancelled() && needs.pin.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.choose.outputs.published }}
      fallback: ${{ steps.choose.outputs.fallback }}
      bundle: ${{ steps.choose.outputs.bundle }}
      fallback_bundle: ${{ steps.choose.outputs.fallback_bundle }}
    steps:
      # each pinned build by its exact name in this run and attempt, never a pattern or a job output: a
      # pattern also matches an earlier attempt's upload of a build that failed this time, and a matrix
      # job's outputs keep only the last leg's values
      - id: find
        name: Find the builds this attempt uploaded
        uses: actions/github-script@v7
        env:
          BUILD: ${{ needs.pin.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const attempt = process.env.RUN_ATTEMPT;
            const wanted = JSON.parse(process.env.BUILD).map(b => ({ ...b, name: `dist-${b.branch}-${b.sha}-${context.runId}-${attempt}` }));
            // the listing can lag behind an upload that just finished (see the note above the build job): list
            // again, a few seconds apart, while a build this attempt should have uploaded is missing (council
            // round 5, Fable). A failed leg uploads nothing, so the wait stays bounded.
            const LISTINGS = 5;
            const PAUSE_MS = 5000;
            let artifacts = [];
            let uploaded = new Set();
            for (let n = 1; n <= LISTINGS; n++) {
              artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: context.runId, per_page: 100 });
              uploaded = new Set(artifacts.filter(a => !a.expired).map(a => a.name));
              const missing = wanted.filter(b => !uploaded.has(b.name)).map(b => b.name);
              if (!missing.length) break;
              if (n < LISTINGS) {
                core.info(`listing ${n} of ${LISTINGS}: ${missing.join(', ')} not listed yet`);
                await new Promise(resolve => setTimeout(resolve, PAUSE_MS));
              } else if (process.env.BUILD_RESULT === 'success') {
                core.warning(`every build leg passed, but ${missing.join(', ')} was not listed after ${LISTINGS} listings`);
              }
            }
            const names = { main: '', preprod: '', live: '' };
            for (const b of wanted) {
              const name = b.name;
              if (uploaded.has(name)) { names[b.live ? 'live' : b.branch] = name; continue; }
              // "Re-run failed jobs" keeps a passed leg from an earlier attempt; only this attempt's builds count
              const earlier = artifacts.find(a => a.name.startsWith(`dist-${b.branch}-${b.sha}-${context.runId}-`));
              core.warning(`${b.branch} ${b.sha}: no build from attempt ${attempt}${earlier ? ` (${earlier.name} is from an earlier attempt; use "Re-run all jobs")` : ''}`);
            }
            for (const [key, name] of Object.entries(names)) core.setOutput(key, name);
      - name: Fetch this attempt's main build
        if: ${{ steps.find.outputs.main != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find.outputs.main }}
          path: dists/${{ steps.find.outputs.main }}
      - name: Fetch this attempt's preprod build
        if: ${{ steps.find.outputs.preprod != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find.outputs.preprod }}
          path: dists/${{ steps.find.outputs.preprod }}
      - name: Fetch this attempt's rebuild of the other branch's live build
        if: ${{ steps.find.outputs.live != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find.outputs.live }}
          path: dists/${{ steps.find.outputs.live }}
      - name: Fetch the other branch's last good build
        if: ${{ needs.pin.outputs.keep_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.pin.outputs.keep_name }}
          path: dists/${{ needs.pin.outputs.keep_name }}
          run-id: ${{ needs.pin.outputs.keep_run }}
          github-token: ${{ github.token }}
      - id: choose
        name: Choose each branch's build
        uses: actions/github-script@v7
        env:
          BUILD: ${{ needs.pin.outputs.build }}
          BUILT: ${{ toJSON(steps.find.outputs) }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUSHED: ${{ needs.pin.outputs.pushed }}
          KEEP: ${{ needs.pin.outputs.keep }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const built = JSON.parse(process.env.BUILD);
            // artifact names the find step matched for this attempt (a failed leg uploaded nothing)
            const names = (() => { try { return JSON.parse(process.env.BUILT || '{}') ?? {}; } catch { return {}; } })();
            const keep = process.env.KEEP ? JSON.parse(process.env.KEEP) : null;
            const pushed = process.env.PUSHED;
            const tip = async (branch) => (await github.rest.repos.getBranch({ owner, repo, branch })).data.commit.sha;
            const published = [];
            // only this run and attempt's own upload of this exact commit counts
            const ours = (b, name) => {
              const own = b && typeof name === 'string' && name === `dist-${b.branch}-${b.sha}-${context.runId}-${process.env.RUN_ATTEMPT}` && fs.existsSync(`dists/${name}/index.html`);
              return own ? { branch: b.branch, sha: b.sha, dir: `dists/${name}`, run: context.runId, artifact: name } : null;
            };
            // the other branch's live build: its kept artifact, or this attempt's rebuild of it (Sol P4, round 4)
            const rebuilt = ours(built.find(b => b.live), names.live);
            const kept = rebuilt ?? (keep ? { branch: keep.branch, sha: keep.sha, dir: `dists/${keep.name}`, run: keep.run, artifact: keep.name } : null);
            for (const branch of ['main', 'preprod']) {
              const mine = built.find(b => b.branch === branch && !b.live);
              const fresh = ours(mine, names[branch]);
              if (branch === pushed) {
                // round 5 (Fable): every leg passed, so its upload was not found (listing lag), not a failed test
                if (!fresh) return core.setFailed(process.env.BUILD_RESULT === 'success'
                  ? `${branch} ${mine?.sha}: every build leg passed, but its build artifact was not found; nothing is published (use "Re-run all jobs")`
                  : `${branch} ${mine?.sha}: its tests, sweep or build failed; nothing is published`);
                // a rerun of an older push: the newer push publishes instead
                const now = await tip(branch);
                if (now !== mine.sha) {
                  core.warning(`${branch} ${mine.sha} is superseded by ${now}; this run publishes nothing`);
                  return core.setOutput('published', '');
                }
                published.push(fresh);
              } else if (fresh) {
                published.push(fresh);
              } else if (kept?.branch === branch && fs.existsSync(`${kept.dir}/index.html`)) {
                if (mine) core.warning(`${branch} ${mine.sha} failed; the site keeps ${kept.sha}`);
                published.push(kept);
              } else if (mine) {
                return core.setFailed(`${branch} ${mine.sha} failed and there is no earlier good build to keep`);
              }
            }
            // if the other branch's new build is superseded before the deploy, the deploy job publishes this
            // bundle instead: the same pushed build, with the other branch's live build (Sol P1, round 3)
            const other = published.find(p => p.branch !== pushed);
            const fallback = other && kept && other.branch === kept.branch && other.sha !== kept.sha && fs.existsSync(`${kept.dir}/index.html`)
              ? published.map(p => (p === other ? kept : p))
              : null;
            const bundle = `pages-${context.runId}-${process.env.RUN_ATTEMPT}`;
            core.setOutput('published', JSON.stringify(published));
            core.setOutput('bundle', bundle);
            core.setOutput('fallback', fallback ? JSON.stringify(fallback) : '');
            core.setOutput('fallback_bundle', fallback ? `${bundle}-fallback` : '');
      - name: Assemble production (main) and preprod
        if: ${{ steps.choose.outputs.published != '' }}
        env:
          PUBLISHED: ${{ steps.choose.outputs.published }}
          FALLBACK: ${{ steps.choose.outputs.fallback }}
        run: |
          set -euo pipefail
          # $1: the chosen builds (JSON), $2: the site directory to fill
          assemble() {
            local main preprod
            main=$(jq -r '.[] | select(.branch == "main") | .dir' <<<"$1")
            preprod=$(jq -r '.[] | select(.branch == "preprod") | .dir' <<<"$1")
            mkdir -p "$2"
            cp -r "$main/." "$2/"
            if [ -n "$preprod" ]; then cp -r "$preprod" "$2/preprod"; fi
            mkdir -p "$2/pixi"
            printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Night Shift preprod</title>' \
              '<meta http-equiv="refresh" content="0; url=../preprod/">' \
              '<script>location.replace("../preprod/" + location.search + location.hash)</script>' \
              > "$2/pixi/index.html"
            # the run and artifact let a later run republish exactly this build
            jq -c 'map({branch, sha, run, artifact})' <<<"$1" > "$2/deployed.json"
          }
          assemble "$PUBLISHED" site
          if [ -n "$FALLBACK" ]; then assemble "$FALLBACK" site-fallback; fi
      - uses: actions/configure-pages@v5
        if: ${{ steps.choose.outputs.published != '' }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ steps.choose.outputs.published != '' }}
        with:
          path: site
          name: ${{ steps.choose.outputs.bundle }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ steps.choose.outputs.fallback != '' }}
        with:
          path: site-fallback
          name: ${{ steps.choose.outputs.fallback_bundle }}
  deploy:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.assemble.outputs.published != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: fresh
        name: Pick the bundle whose builds are all still current
        uses: actions/github-script@v7
        env:
          PUBLISHED: ${{ needs.assemble.outputs.published }}
          BUNDLE: ${{ needs.assemble.outputs.bundle }}
          FALLBACK: ${{ needs.assemble.outputs.fallback }}
          FALLBACK_BUNDLE: ${{ needs.assemble.outputs.fallback_bundle }}
        with:
          script: |
            // A rerun keeps its original SHAs: a bundle publishes only if every SHA in it is still its
            // branch's tip or what the site serves now, so an older commit never replaces a newer
            // deployment. Both bundles hold the same pushed build; the fallback swaps the other branch's
            // new build for its live one, so a superseded preprod (or main) tip never blocks the push.
            const { owner, repo } = context.repo;
            const tips = new Map();
            const tip = async (branch) => {
              if (!tips.has(branch)) tips.set(branch, (await github.rest.repos.getBranch({ owner, repo, branch })).data.commit.sha);
              return tips.get(branch);
            };
            const live = await (async () => {
              try {
                const site = (await github.rest.repos.getPages({ owner, repo })).data.html_url.replace(/\/$/, '');
                const res = await fetch(`${site}/deployed.json?run=${context.runId}-${Date.now()}`, { cache: 'no-store' });
                const list = res.ok ? await res.json() : [];
                return Array.isArray(list) ? list : [];
              } catch { return []; }
            })();
            const staleIn = async (list) => {
              const stale = [];
              for (const { branch, sha } of list) {
                const now = await tip(branch);
                const was = live.find(t => t.branch === branch)?.sha;
                if (sha !== now && sha !== was) stale.push(`${branch} ${sha} (tip ${now}, live ${was ?? 'none'})`);
              }
              return stale;
            };
            const bundles = [[process.env.PUBLISHED, process.env.BUNDLE], [process.env.FALLBACK, process.env.FALLBACK_BUNDLE]]
              .filter(([list, name]) => list && name)
              .map(([list, name]) => ({ list: JSON.parse(list), name }));
            for (const [i, bundle] of bundles.entries()) {
              const stale = await staleIn(bundle.list);
              if (stale.length) { core.warning(`Superseded in ${bundle.name}: ${stale.join('; ')}`); continue; }
              if (i > 0) core.warning(`Publishing ${bundle.name}: ${bundle.list.map(b => `${b.branch} ${b.sha}`).join(', ')}`);
              core.setOutput('artifact', bundle.name);
              return core.setOutput('publish', 'true');
            }
            core.warning('Superseded, not publishing');
            core.setOutput('publish', 'false');
      - id: publish
        if: ${{ steps.fresh.outputs.publish == 'true' }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ steps.fresh.outputs.artifact }}
