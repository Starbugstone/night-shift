name: Test and publish game
# One Pages site, two builds:
#   /           production, from main
#   /preprod/   preprod, from the preprod branch, to try changes before they reach main
#   /pixi/      redirects to /preprod/ (the old preprod address)
# A push to either branch tests that branch, then rebuilds and republishes both.
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Build and deploy are separate jobs (the layout GitHub documents): deploying in the same job as
  # the upload sometimes asked for the artifact before it was listed ("No artifacts named
  # github-pages"), failing about one push in three.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the pushed branch must pass its own tests before anything is published
      - run: npm ci
      - run: npm test
      - name: Build production (main) and preprod
        env:
          REPO: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          build() {
            git clone --quiet --depth 1 --branch "$1" "$REPO" "$RUNNER_TEMP/$1"
            (cd "$RUNNER_TEMP/$1" && npm ci --no-audit --no-fund && npm run build)
          }
          build main
          mkdir -p site
          cp -r "$RUNNER_TEMP/main/dist/." site/
          if git ls-remote --exit-code --heads "$REPO" preprod > /dev/null; then
            build preprod
            cp -r "$RUNNER_TEMP/preprod/dist" site/preprod
          fi
          mkdir -p site/pixi
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Night Shift preprod</title>' \
            '<meta http-equiv="refresh" content="0; url=../preprod/">' \
            '<script>location.replace("../preprod/" + location.search + location.hash)</script>' \
            > site/pixi/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
